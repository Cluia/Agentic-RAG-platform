services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro

volumes:
  qdrant_data:
